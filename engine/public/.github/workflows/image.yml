name: image

# Build the engine image, run the MCP end-to-end test against it, and on a
# version tag publish it for Intel and ARM (Apple Silicon) to GitHub Packages.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pdf-engine

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: engine/Dockerfile
          load: true
          tags: pdf-engine:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test over MCP (stdio)
        run: |
          pip install mcp==1.30.0 reportlab pypdf
          sudo apt-get install -y poppler-utils
          mkdir -p /tmp/pdf-engine-test && chmod 777 /tmp/pdf-engine-test
          python engine/tests/test_mcp.py --server "docker run -i --rm --user $(id -u):$(id -g) -v /tmp/pdf-engine-test:/tmp/pdf-engine-test pdf-engine:test mcp"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: engine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
